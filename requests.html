<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quote Requests — Tour Rider Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="css/logo_tour_ride-removebg-preview-1-3-300x175.png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="https://tour-rider.com/">
      <img src="css/logo_tour_ride-removebg-preview-1-3-300x175.png" alt="Tour Rider" class="logo-img">
    </a>
    <nav id="main-nav">
      <a href="index.html">Fleet</a>
      <a href="#" id="logout-link" style="display:none">Log out</a>
    </nav>
  </div>
</header>

<div class="form-wrap">
  <!-- login -->
  <div id="login-view" class="form-card" style="display:none">
    <h1>Admin sign in</h1>
    <p class="form-lede">Sign in to review incoming quote requests.</p>
    <div id="login-error" class="alert alert-error" style="display:none"></div>
    <form id="login-form">
      <div class="field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-submit" id="login-btn">Sign in</button>
    </form>
  </div>

  <!-- dashboard -->
  <div id="dash-view" style="display:none">
    <h1 style="margin-bottom:.35rem">Quote requests</h1>
    <p class="form-lede" id="dash-sub"></p>
    <div class="req-toolbar">
      <select id="status-filter">
        <option value="pending">Pending</option>
        <option value="accepted">Accepted</option>
        <option value="declined">Declined</option>
        <option value="paid">Paid</option>
        <option value="">All</option>
      </select>
      <button class="btn-gold" id="refresh-btn" style="border:none;cursor:pointer">Refresh</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<script src="config.js"></script>
<script src="js/requests.js"></script>
</body>
</html>
