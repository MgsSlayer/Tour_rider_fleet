<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Your Booking — Tour Rider</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="css/logo_tour_ride-removebg-preview-1-3-300x175.png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="https://tour-rider.com/">
      <img src="css/logo_tour_ride-removebg-preview-1-3-300x175.png" alt="Tour Rider" class="logo-img">
    </a>
  </div>
</header>

<div class="form-wrap">
  <div class="form-card">
    <div id="loading" class="state-msg">Loading your quote…</div>

    <div id="error-state" style="display:none">
      <div class="alert alert-error" id="error-msg"></div>
      <p class="form-lede">Need help? Email <a href="mailto:booking@tour-rider.com">booking@tour-rider.com</a>.</p>
    </div>

    <div id="pay-state" style="display:none">
      <h1>Complete your booking</h1>
      <p class="form-lede">Your quote has been approved. Choose how you'd like to pay.</p>

      <div class="trip-summary">
        <dl id="trip-details"></dl>
      </div>

      <div class="amount-choice">
        <label>
          <input type="radio" name="paymentOption" value="deposit" checked>
          <div class="ac-label">Deposit</div>
          <div class="ac-amount" id="deposit-amount">—</div>
          <div class="ac-note">Balance charged on pickup day</div>
        </label>
        <label>
          <input type="radio" name="paymentOption" value="full">
          <div class="ac-label">Pay in full</div>
          <div class="ac-amount" id="full-amount">—</div>
          <div class="ac-note">Nothing further due</div>
        </label>
      </div>

      <div id="deposit-note" class="alert alert-info">
        We'll securely save your card and charge the remaining balance on the morning of your trip.
      </div>

      <div id="card-container"></div>
      <div id="pay-error" class="alert alert-error" style="display:none"></div>
      <button id="pay-button" class="btn-submit">Pay <span id="pay-amount"></span></button>
    </div>

    <div id="done-state" style="display:none">
      <div class="alert alert-ok"><strong>Payment received.</strong> Your ride is confirmed.</div>
      <p class="form-lede" id="done-note"></p>
      <a href="index.html" class="btn-gold">Back to the fleet</a>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="js/payment.js"></script>
</body>
</html>
