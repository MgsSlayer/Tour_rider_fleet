<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vehicle Detail — Tour Rider</title>
  <link rel="icon" type="image/png" href="css/logo_tour_ride-removebg-preview-1-3-300x175.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="https://tour-rider.com/">
      <img src="css/logo_tour_ride-removebg-preview-1-3-300x175.png" alt="Tour Rider" class="logo-img">
    </a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav id="main-nav">
      <a href="https://tour-rider.com/">Home</a>
      <a href="index.html">Rides</a>
      <a href="https://tour-rider.com/merch/">Merch</a>
      <a href="https://tour-rider.com/about-us/">About us</a>
      <a href="https://tour-rider.com/contact-us/">Contact us</a>
      <a href="custom-quote.html">Find me a vehicle</a>
      <a href="quote.html" class="btn-gold">Request quote</a>
    </nav>
  </div>
  <div class="header-contact">
    <div class="header-contact-inner">
      <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/></svg> <a href="mailto:booking@tour-rider.com">booking@tour-rider.com</a></span>
      <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.06 11a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 2.98 0h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 7.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21 15z"/></svg> <a href="tel:+19178222713">917-822-2713</a></span>
    </div>
  </div>
</header>

<main>

  <!-- Loading -->
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <p>Loading vehicle details…</p>
  </div>

  <!-- Error -->
  <div id="error-state" style="display:none">
    <div class="breadcrumb">
      <a href="index.html">← All vehicles</a>
    </div>
    <div class="alert alert-error" id="error-msg"></div>
  </div>

  <!-- Vehicle content -->
  <div id="vehicle-content" style="display:none">

    <div class="breadcrumb">
      <a href="index.html">All vehicles</a>
      <span class="breadcrumb-sep">/</span>
      <span id="page-title">Vehicle</span>
    </div>

    <div class="vehicle-detail">

      <!-- Left: image -->
      <div>
        <div class="detail-image-wrap" id="image-wrap"></div>
      </div>

      <!-- Right: details -->
      <div class="detail-sidebar">
        <h1 class="detail-title" id="detail-title"></h1>
        <span class="type-pill" id="detail-type-badge" style="display:none"></span>

<div class="specs-grid">
          <div class="spec-item">
            <div class="spec-label">Make</div>
            <div class="spec-value" id="spec-make">—</div>
          </div>
          <div class="spec-item">
            <div class="spec-label">Model</div>
            <div class="spec-value" id="spec-model">—</div>
          </div>
          <div class="spec-item">
            <div class="spec-label">Type</div>
            <div class="spec-value" id="spec-type">—</div>
          </div>
          <div class="spec-item">
            <div class="spec-label">Capacity</div>
            <div class="spec-value" id="spec-capacity">—</div>
          </div>
          <div class="spec-item">
            <div class="spec-label">Luggage</div>
            <div class="spec-value" id="spec-luggage">—</div>
          </div>
        </div>

        <div class="detail-actions">
          <a class="btn-gold" id="quote-link" href="quote.html">Get quote</a>
          <button class="share-btn" id="share-btn">🔗 Copy Link</button>
        </div>
      </div>

    </div>
  </div>

</main>

<!-- Fullscreen image viewer -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightbox-close" aria-label="Close">&times;</button>
  <button class="carousel-btn carousel-prev" id="lightbox-prev" aria-label="Previous photo">&#8249;</button>
  <img class="lightbox-img" id="lightbox-img" src="" alt="">
  <button class="carousel-btn carousel-next" id="lightbox-next" aria-label="Next photo">&#8250;</button>
  <div class="carousel-dots" id="lightbox-dots"></div>
</div>

<footer>
  <p>© Tour Rider — NYC Limo &amp; Party Bus Rentals</p>
</footer>

<script src="config.js"></script>
<script src="js/sheets.js"></script>
<script src="js/lightbox.js"></script>
<script src="js/vehicle.js"></script>
<script src="js/nav.js"></script>

</body>
</html>
