<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm Availability — Tour Rider</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="css/logo_tour_ride-removebg-preview-1-3-300x175.png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/forms.css">
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="https://tour-rider.com/">
      <img src="css/logo_tour_ride-removebg-preview-1-3-300x175.png" alt="Tour Rider" class="logo-img">
    </a>
  </div>
  <div class="header-contact">
    <div class="header-contact-inner">
      <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/></svg> <a href="mailto:booking@tour-rider.com">booking@tour-rider.com</a></span>
      <span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.06 11a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 2.98 0h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 7.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21 15z"/></svg> <a href="tel:+19178222713">917-822-2713</a></span>
    </div>
  </div>
</header>

<div class="form-wrap">
  <div class="form-card">
    <div id="loading" class="state-msg">Loading the request…</div>

    <div id="error-state" hidden>
      <div class="alert alert-error" id="error-msg"></div>
      <p class="form-lede">Questions? Email <a href="mailto:booking@tour-rider.com">booking@tour-rider.com</a> or call <a href="tel:+19178222713">917-822-2713</a>.</p>
    </div>

    <div id="ask-state" hidden>
      <h1>Are you available?</h1>
      <p class="form-lede">A customer has requested your vehicle through Tour Rider. Please let us know whether you and this vehicle are available for this trip.</p>

      <div class="trip-summary">
        <dl id="trip-details"></dl>
      </div>

      <div class="field" id="decline-box" hidden>
        <label for="decline-reason">Reason (optional)</label>
        <textarea id="decline-reason" maxlength="500" placeholder="For example: already booked that day"></textarea>
      </div>

      <div class="alert alert-error" id="form-msg" hidden></div>

      <div class="avail-actions">
        <button type="button" id="accept-btn" class="btn-submit">I'm available</button>
        <button type="button" id="decline-btn" class="btn btn-secondary">Not available</button>
      </div>
    </div>

    <div id="done-state" hidden>
      <div class="alert" id="done-msg"></div>
      <div class="trip-summary">
        <dl id="done-details"></dl>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="js/availability.js"></script>
</body>
</html>
